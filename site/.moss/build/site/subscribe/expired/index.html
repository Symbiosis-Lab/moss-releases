<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Link expired</title>
  <link rel="stylesheet" href="/_moss/style.css" />
  <style>
    .moss-subscribe-landing {
      max-width: 36rem;
      margin: 12vh auto;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }
    .moss-subscribe-landing h1 {
      margin: 0 0 0.5em;
      font-size: 1.4rem;
      font-weight: 500;
    }
    .moss-subscribe-landing p {
      color: var(--moss-color-muted, #8a8580);
      margin: 0 0 1.5em;
      font-size: 1rem;
    }
    .moss-subscribe-landing a {
      color: var(--moss-color-accent, #2d5a2d);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
  </style>
</head>
<body>
  <main class="moss-subscribe-landing">
    <h1>This link has expired</h1>
    <p>Subscription links are valid for 48 hours. Please subscribe again from the site.</p>
    <p><a href="/">← Back to the site</a></p>
  </main>
</body>
</html>
